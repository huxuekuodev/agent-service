[project]
name = "deer-agent-service"
version = "0.1.0"
description = "独立 Agent 服务：基于 LangGraph 的 planner-execute 模式，FastAPI 提供会话/对话接口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-postgres>=3.1.0,<3.2",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
    "langfuse>=4.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.1.0",
    "loguru>=0.7.3",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pyrefly]
python-interpreter = ".venv/bin/python3"
project-includes = ["."]