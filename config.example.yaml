config_version: 1
log_level: INFO
logging:
  level: INFO
  file:

# 打点（tracking）：独立数据日志，不写入执行日志 app.log。
# 每行一条打点：{ISO 时间} {base64(protobuf)}，供后续接入 Kafka/数仓等数据链路。
tracking:
  output: logs/tracking.data

# Token 计费（可选）：按模型角色（models 段 key）配置输入/输出单价（元 / 1K tokens）。
# 未配置的模型按 0 计费；token 统计不受影响，只影响费用字段。
token_pricing:
  default:
    input_price: 0.002
    output_price: 0.008

# 模型角色 → LLM 实例名（app/llm/instances/ 中注册的实例；每个实例只配置一套，
# 模型类 / 模型名 / API Key 环境变量 / 端点 / 超时等都在实例里定义）。
# 换渠道或换 key：新增一个实例文件并把角色指向它即可，无需重复配置。
models:
  default: deepseek
  plan_node_model: deepseek
  general_node_model: deepseek
  evaluate_model: deepseek
  # vision_model: qwen_vl    # 可选：知识库图片转文字（对应 ingest.vision_model 角色名）

# SKILL 能力：标准 SOP 技能库（skills/ 目录）与 E2B 沙箱执行
skills:
  enabled: true            # 总开关：false 时禁用技能链路（不注入索引/skill_probe/技能工具）
  dir: skills
  cleanup_default: confirm   # 产物清理默认等级：auto / confirm / forbidden
  max_candidates: 3          # 一次请求最多候选 skill 数
  sandbox:
    # ---- 沙箱后端：docker（默认，一次性容器，省钱）/ e2b（云端，可选回退）----
    backend: docker
    docker_url: $DOCKER_HOST_URL        # ssh://user@host:22 或 unix:///var/run/docker.sock
    docker_image: python:3.11           # 需已存在于目标 Docker 主机
    docker_network_mode: host           # 技能脚本走宿主机网络（host/bridge/none）
    host_tmp_dir: /tmp/deer-skills      # 宿主机技能目录根，按天分目录（当天复用不重传）
    command_timeout: 5                  # 单条命令超时即 kill 容器（秒）
    mem_limit: 256m                     # 容器内存上限
    pids_limit: 128                     # 容器进程数上限
    tmpfs_size: 64m                     # 容器内可写 /tmp 上限（根文件系统只读）
    keep_host_files_days: 2             # 宿主技能目录保留天数
    template:                # 仅 e2b 后端用：E2B 模板名（留空时读环境变量 E2B_TEMPLATE）
    timeout: 3600            # 沙箱最长存活秒数（容器/会话总时长上限）
    # 沙箱会话空闲存活秒数（超时自动销毁；执行 agent 也可主动 sandbox_close）
    session_ttl_seconds: 1800
    # 同时存活的沙箱会话上限
    max_sessions: 4
    max_output_chars: 30000   # 单次执行输出回传 LLM 的最大字符数（0 = 不截断）
    env_keys: [QWEATHER_API_KEY, QWEATHER_HOST]  # 允许注入沙箱的宿主环境变量白名单（key + 专属域名）
    # exclude_patterns: [.env*, *.pem, *.key, ...]  # 同步时跳过的敏感文件（默认已内置）

# 语雀数据源（知识库摄取）
yuque:
  enabled: false
  token: $YUQUE_TOKEN          # 语雀个人令牌
  login:                       # 拉取用户/组织知识库的登录名（为空需在请求里显式传 repos）
  group_repos: false           # true 用 /groups/{login}/repos（组织），false 用 /users/{login}/repos（个人）
  namespaces: []               # 白名单 namespace（org/repo）；空表示拉全部

# 知识库摄取流水线（分块 + 图片转文字 + 入 ES）
ingest:
  enabled: false
  vision_model: vision_model   # 图片转文字用的视觉模型（models 列表里 supports_vision: true 的条目）
  chunk_size: 2000             # 最大 chunk 字符数
  overlap: 200                 # chunk 重叠字符数
  download_images: true        # 是否下载文档图片并转文字
  image_placeholder: "![image]({url})"
  auto_interval_seconds: 0     # 自动同步间隔（秒）；0 关闭。启用后由 FastAPI 后台任务定时触发
  parallel: 4                  # 文档并发处理数

# ElasticSearch 向量库（见 docs/RAG_方案.md）
elasticsearch:
  url: http://localhost:9200
  index: rag_docs
  dims: 1536
  username:
  password:
  verify_certs: true
  reindex_on_ingest: true      # 每次摄取前重建索引（简化全量同步）

# Embedding 模型（向量化 chunk）
embedding:
  model: text-embedding-3-small
  api_key: $EMBEDDING_API_KEY
  base_url:
  dimensions: 1536

# Langfuse 追踪/评估
langfuse:
  enabled: false
  public_key:
  secret_key:
  host: https://cloud.langfuse.com

# 规划评估（LLM-as-Judge，旧配置，向后兼容）
plan_evaluation:
  enabled: false
  sample_rate: 1.0
  judge_model: evaluate_model
  dimensions:
    clarification_quality: true
    task_atomicity: true
    agent_selection_validity: true

# 评估器列表（推荐方式；每个评估器 = 一个 BaseEvaluator 子类实例）
#   use: 子类 import 路径；model: models 列表里的 name；enabled: 总开关；
#   metrics: 按指标名覆盖 {enabled / pass_score / label / description}。

evaluators:
  # 触发点 1：规划完成（规划质量：原子性/依赖/决策/变量/工具可行性）
  - name: plan_evaluation
    display_name: "规划评估"
    use: app.agents.evaluators.plan_evaluator:PlanEvaluator
    model: evaluate_model
    # 系统提示词唯一来源为 Langfuse prompt plan_evaluator_prompt（本地副本仅参考）
    enabled: true
    sample_rate: 1.0
    metrics:
      task_atomicity:
        label: "任务原子性"
        enabled: true
        pass_score: 3.0
      dependency_correctness:
        label: "依赖关系正确性"
        enabled: true
        pass_score: 3.0
      plan_decision_accuracy:
        label: "规划决策准确性"
        enabled: true
        pass_score: 3.0
      variable_reference_accuracy:
        label: "变量引用准确性"
        enabled: true
        pass_score: 3.0
      tool_feasibility:
        label: "工具可行性"
        enabled: true
        pass_score: 3.0

  # 触发点 2：每个任务完成（执行过程：路径效率/回复整洁度）
  - name: general_evaluation
    display_name: "执行评估"
    use: app.agents.evaluators.general_evaluator:GeneralEvaluator
    model: evaluate_model
    # 系统提示词唯一来源为 Langfuse prompt general_evaluator_prompt（本地副本仅参考）
    enabled: true
    sample_rate: 1.0
    metrics:
      path_efficiency:
        label: "路径效率"
        enabled: true
        pass_score: 3.0
      answer_cleanness:
        label: "回复整洁度"
        enabled: true
        pass_score: 3.0

  # 触发点 3：最终回复（用户唯一看到的产出：契合度/有据性/完整性）
  - name: final_answer_evaluation
    display_name: "最终回复评估"
    use: app.agents.evaluators.final_answer_evaluator:FinalAnswerEvaluator
    model: evaluate_model
    # 系统提示词唯一来源为 Langfuse prompt final_answer_evaluator_prompt（本地副本仅参考）
    enabled: true
    sample_rate: 1.0
    metrics:
      question_fit:
        label: "问题契合度"
        enabled: true
        pass_score: 3.0
      groundedness:
        label: "结果有据性"
        enabled: true
        pass_score: 3.0
      completeness:
        label: "完整性"
        enabled: true
        pass_score: 3.0

subagents:
  custom_agents: {}

# 第三方工具配置（供 agent 使用，按业务二分类组织）
#   name: 工具名（agent 看到的工具名）
#   use: 工具可导入路径，可指向：
#     1) 已实例化的 BaseTool 对象（如 @tool 装饰的函数）；
#     2) 工具工厂函数（接收 extra 关键字参数，返回 BaseTool）；
#     3) BaseTool 子类（用 extra 实例化）。
#   category: 业务分类（web / knowledge / ...），仅用于组织代码
#   allowed_agents: 可用 agent 列表；为空表示所有 agent 可用
#   enabled: 总开关
#   extra: 透传给工具工厂/类的额外参数（API Key、endpoint 等，支持 $ENV 引用）
tools:
  - name: web_search
    display_name: 联网搜索
    use: app.agents.tools.web.web_search:make_web_search_tool
    category: web
    allowed_agents: [general_agent]
    enabled: true
    extra:
      api_key: $TAVILY_API_KEY
  - name: newest_doc
    display_name: 语雀文档修订对比
    use: app.agents.tools.yuque.newest_doc:make_newest_doc_tool
    category: yuque
    allowed_agents: [general_agent]
    enabled: true
    extra:
      token: $YUQUE_TOKEN
      login: $YUQUE_LOGIN
  - name: internal_kb
    display_name: 私有知识库
    use: app.agents.tools.knowledge.internal_kb:make_internal_kb_tool
    category: knowledge
    allowed_agents: [general_agent]
    enabled: false  # 需配置 extra.endpoint / extra.api_key 后开启
    extra:
      endpoint: $KB_ENDPOINT
      api_key: $KB_API_KEY


# 数据存储
storage_dir: .deer-agent

# 数据库（checkpointer 共享存储）
# 集群部署必须用 postgres，多节点共享会话状态
# 单机开发可用 memory（重启丢状态）
database:
  backend: memory  # memory | postgres
  postgres_url: $DATABASE_URL

# 业务库（用户 / 会话 / 消息 / 监控配置；与 checkpointer 库分离）
# 建表：psql -d agent_business -f deploy/sql/business_schema.sql
# 设计见 docs/业务库表结构设计.md
business_database:
  postgres_url: $BUSINESS_DATABASE_URL
  # 会话列表默认分页大小（/sessions?limit=）
  sessions_page_size: 20
  # 历史消息默认分页大小（/sessions/{id}/messages?limit=）
  messages_page_size: 50
  # 消息写入失败是否阻塞对话（false：仅记日志，不影响流式返回）
  fail_fast: false

# 认证（账号密码 + JWT）
auth:
  enabled: true
  jwt_secret: $JWT_SECRET            # 生产必须显式配置；留空则认证不可用
  jwt_algorithm: HS256
  access_ttl_minutes: 120            # access token 有效期（无状态校验）
  refresh_ttl_days: 30               # refresh token 有效期（落 user_tokens，可撤销）
  password_min_length: 8
  issuer: deer-agent

# 人工确认：计划生成后是否等用户确认再执行（前端出确认卡片）
# 关闭 plan_review 时图不会中断（自动化/脚本调用场景）
approval:
  plan_review: true          # 计划生成后中断等待确认
  show_internal_tasks: false # 确认卡片是否展示系统内部任务（skill_probe 等）
  allow_feedback: true       # 允许用户只提意见不选选项（留空即照此执行）

# 语音通话（页面内与 agent 语音对话：浏览器识别 → agent → 服务端按句 TTS → 播放）
# TTS 走 OpenAI 兼容接口（硅基流动，复用 SILICONFLOW_KEY，无需额外账号/依赖）
voice:
  enabled: true
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_KEY          # Key 的环境变量名（不存明文）
  tts_model: FunAudioLLM/CosyVoice2-0.5B
  tts_voice: FunAudioLLM/CosyVoice2-0.5B:alex
  chunk_max_chars: 60                   # 单块播报上限
  chunk_min_chars: 12                   # 单块下限（短句并到下一句）
  first_chunk_max_chars: 30             # 首块上限：越小第一声越快
  max_chunks: 20                        # 最多合成块数
  timeout: 45                           # 单次 TTS 超时（秒）

# 评估策略（见 docs/评估闭环方案.md）
# 三个触发点全部异步执行，阈值/采样在**调用 agent 时**一次性决定（节点内部不再判断）
evaluation_policy:
  mode: always               # always（测试阶段全触发）| worth_it（只评有信号轮次）| off
  triggers:
    plan_done: true          # 规划完成时评估
    task_done: true          # 每个任务完成时评估
    final_answer: true       # 最终回复时评估
  thresholds:
    sample_rate: 1.0         # 链级采样率（1.0 = 全跑）
    min_task_count: 0        # 任务数达到该值才评任务（0 = 全部）
    max_task_evals: 0        # 单链任务评估次数上限（0 = 不限）
    max_evals_per_run: 0     # 单链评估总次数上限（0 = 不限）
  baseline_sample_rate: 0.05 # worth_it 模式下普通轮次的抽样率
  async_enabled: true        # 全部异步，不占对话延迟
  max_concurrency: 2         # 后台评估并发上限
  archive_bad_cases: true    # 低分样本连同完整上下文归档（改进原料）
