config_version: 1
log_level: INFO
logging:
  level: INFO
  file:

# 模型列表，第一个为默认模型
models:
  - name: default
    display_name: "DeepSeek"
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url:
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false
  - name: plan_node_model
    display_name: "规划节点模型"
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url:
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false
  - name: general_node_model
    display_name: "执行节点模型"
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url:
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false
  - name: evaluate_model
    display_name: "评估模型"
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url:
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false

# Langfuse 追踪/评估
langfuse:
  enabled: false
  public_key:
  secret_key:
  host: https://cloud.langfuse.com

# 规划评估（LLM-as-Judge，旧配置，向后兼容）
plan_evaluation:
  enabled: false
  sample_rate: 1.0
  judge_model: evaluate_model
  dimensions:
    clarification_quality: true
    task_atomicity: true
    agent_selection_validity: true

# 评估器列表（推荐方式；每个评估器 = 一个 BaseEvaluator 子类实例）
#   use: 子类 import 路径；model: models 列表里的 name；enabled: 总开关；
#   metrics: 按指标名覆盖 {enabled / pass_score / label / description}。
evaluators:
  - name: plan_evaluation
    display_name: "规划评估"
    use: app.agents.evaluation.plan_evaluator:PlanEvaluator
    model: evaluate_model
    system_prompt: |
      你是规划质量评估器。评估规划 agent 的决策质量，输出严格 JSON。
      规划 agent 可能的三种输出：
      1. 调用了 ask_clarification（clarification_requested=true）：需求含糊时澄清，是正确行为。
      2. 输出计划（tasks 非空）：需求清晰时拆解为原子任务。
      3. 直接回复（既未澄清也未产出计划）：若需求可执行却直接放弃，则是失败场景。
    enabled: true
    sample_rate: 1.0
    metrics:
      clarification_quality:
        enabled: true
        pass_score: 0.8
      task_atomicity:
        enabled: true
        pass_score: 0.8
      agent_selection_validity:
        enabled: true
        pass_score: 0.8

# 执行 agent 配置
subagents:
  custom_agents: {}

# 第三方工具配置（供 agent 使用，按业务二分类组织）
#   name: 工具名（agent 看到的工具名）
#   use: 工具可导入路径，可指向：
#     1) 已实例化的 BaseTool 对象（如 @tool 装饰的函数）；
#     2) 工具工厂函数（接收 extra 关键字参数，返回 BaseTool）；
#     3) BaseTool 子类（用 extra 实例化）。
#   category: 业务分类（web / knowledge / ...），仅用于组织代码
#   allowed_agents: 可用 agent 列表；为空表示所有 agent 可用
#   enabled: 总开关
#   extra: 透传给工具工厂/类的额外参数（API Key、endpoint 等，支持 $ENV 引用）
tools:
  - name: web_search
    display_name: 联网搜索
    use: app.agents.tools.web.web_search:make_web_search_tool
    category: web
    allowed_agents: [general_agent]
    enabled: true
    extra:
      api_key: $TAVILY_API_KEY
  - name: internal_kb
    display_name: 私有知识库
    use: app.agents.tools.knowledge.internal_kb:make_internal_kb_tool
    category: knowledge
    allowed_agents: [general_agent]
    enabled: false  # 需配置 extra.endpoint / extra.api_key 后开启
    extra:
      endpoint: $KB_ENDPOINT
      api_key: $KB_API_KEY


# 数据存储
storage_dir: .deer-agent

# 数据库（checkpointer 共享存储）
# 集群部署必须用 postgres，多节点共享会话状态
# 单机开发可用 memory（重启丢状态）
database:
  backend: memory  # memory | postgres
  postgres_url: $DATABASE_URL

